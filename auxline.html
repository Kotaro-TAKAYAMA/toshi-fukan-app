    <title>補助線の調整（都市俯瞰景観 対応付け実験）</title>
    <style>html,body{color:#eee;background:#111;width:100%;height:100%;margin:0;font:14px sans-serif;overflow:hidden}#stage{transform-origin:0 0;width:1920px;height:1080px;position:fixed;top:0;left:0}#cesiumContainer{width:1200px;height:1080px;position:absolute;top:0;left:0}#panel{box-sizing:border-box;width:720px;height:1080px;padding:24px 32px;position:absolute;top:0;left:1200px;overflow-y:auto}h1{margin:0 0 12px;font-size:20px}.note{color:#aaa;font-size:13px;line-height:1.6}.row{grid-template-columns:220px 1fr 64px;align-items:center;gap:12px;margin:10px 0;display:grid}.row input[type=range]{width:100%}.links a{color:#9cf;margin-right:10px}.links .current{color:#fff;font-weight:700}button{margin-right:8px;padding:6px 14px;font-size:14px}textarea{box-sizing:border-box;width:100%;height:190px;margin-top:8px;font:13px monospace}#cover{white-space:pre-wrap;text-align:center;z-index:10;background:#222;justify-content:center;align-items:center;font-size:20px;display:flex;position:fixed;inset:0}#cover[hidden]{display:none}</style>
    <script type="module" crossorigin src="/toshi-fukan-app/assets/auxline-DhX2L36O.js"></script>
    <link rel="modulepreload" crossorigin href="/toshi-fukan-app/assets/load-sKtxKNyG.js">
    <link rel="modulepreload" crossorigin href="/toshi-fukan-app/assets/modulepreload-polyfill-P2Xu9kJm.js">
    <link rel="modulepreload" crossorigin href="/toshi-fukan-app/assets/overheadViewer-DFVtrh8e.js">

  </head>
  <body>
    <div id="stage">
      <div id="cesiumContainer"></div>
      <div id="panel">
        <h1>補助線の調整</h1>
        <p class="note">
          値を動かすと、左の俯瞰景観の補助線がその場で変わります（設定はこのブラウザに保存され、対象地や俯角を切り替えても引き継がれます）。
          決まったら「設定をコピー」を押し、内容を settings/auxline.json に貼り付ける（または開発者に送る）と、実験の画面に反映されます。
        </p>
        <div class="links" id="siteLinks"></div>
        <div class="links" id="levelLinks"></div>
        <div id="controls"></div>
        <p>
          <label><input type="checkbox" id="showLines" checked /> 補助線を表示する（オフにして見比べる）</label>
        </p>
        <p>
          <button id="copy">設定をコピー</button>
          <button id="reset">設定ファイル（settings/auxline.json）の値に戻す</button>
          <span id="copied"></span>
        </p>
        <textarea id="json" readonly></textarea>
      </div>
    </div>
    <div id="cover">読み込み中…</div>
  </body>
